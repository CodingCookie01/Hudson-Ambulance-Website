<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hudson Ambulance | Contact</title>
  <meta name="description" content="Contact Hudson Ambulance." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-mark">H</span>
        Hudson Ambulance
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="fundraisers.html">Fundraisers</a></li>
          <li class="nav-item"><a class="nav-link" href="staff.html">Staff</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="btn btn-primary ms-lg-2" href="donate.html">Donate</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="page-shell">
    <div class="container">
      <div class="row g-5">
        <div class="col-lg-6">
          <div class="page-header">
            <p class="eyebrow text-primary">Get in touch</p>
            <h1>Contact Hudson Ambulance</h1>
          </div>

          <div class="contact-card">
            <p><strong>Phone:</strong> (555) 123-4567</p>
            <p><strong>Email:</strong> info@hudsonambulance.org</p>
            <p><strong>Address:</strong> 123 Main Street, Hudson, NY</p>
          </div>
        </div>

        <div class="col-lg-6">
          <form class="contact-form">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" placeholder="Your name" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="you@example.com" />
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="5" placeholder="How can we help?"></textarea>
            </div>
            <button type="button" class="btn btn-primary" onclick="alert('This form is ready for Formspree, Netlify Forms, or a custom backend.')">
              Send message
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <a class="footer-brand" href="index.html">Hudson Ambulance</a>
        </div>
        <div class="col-md-6 text-md-end">
          <a href="contact.html">Contact</a>
          <a href="donate.html">Donate</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
